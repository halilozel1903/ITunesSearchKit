<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="ITunesSearchKit: a Swift client for the iTunes Search API, with a Mac app" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0b1f"/>
      <stop offset="1" stop-color="#2a0f3d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4678"/>
      <stop offset="1" stop-color="#7828c8"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2730"/>
      <stop offset="1" stop-color="#1c1a20"/>
    </linearGradient>
    <linearGradient id="tile1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5c542"/>
      <stop offset="1" stop-color="#e2683c"/>
    </linearGradient>
    <linearGradient id="tile2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4dd9cc"/>
      <stop offset="1" stop-color="#2a73db"/>
    </linearGradient>
    <linearGradient id="tile3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4678"/>
      <stop offset="1" stop-color="#7828c8"/>
    </linearGradient>
    <linearGradient id="tile4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9be15d"/>
      <stop offset="1" stop-color="#00a19a"/>
    </linearGradient>
    <linearGradient id="tile5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9d6ff"/>
      <stop offset="1" stop-color="#7f8cff"/>
    </linearGradient>
    <linearGradient id="tile6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb199"/>
      <stop offset="1" stop-color="#ff0844"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="560" fill="url(#bg)"/>

  <!-- Title -->
  <text x="80" y="196" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="700" fill="#ffffff">ITunesSearchKit</text>
  <text x="82" y="246" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#d3b8e0">Swift client for the iTunes Search API</text>
  <g font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600">
    <rect x="82" y="284" width="96" height="40" rx="20" fill="#ff4678" fill-opacity="0.18"/>
    <text x="130" y="310" text-anchor="middle" fill="#ff8fb0">Music</text>
    <rect x="190" y="284" width="124" height="40" rx="20" fill="#ff4678" fill-opacity="0.18"/>
    <text x="252" y="310" text-anchor="middle" fill="#ff8fb0">Podcasts</text>
    <rect x="326" y="284" width="108" height="40" rx="20" fill="#ff4678" fill-opacity="0.18"/>
    <text x="380" y="310" text-anchor="middle" fill="#ff8fb0">Movies</text>
    <rect x="446" y="284" width="96" height="40" rx="20" fill="#ff4678" fill-opacity="0.18"/>
    <text x="494" y="310" text-anchor="middle" fill="#ff8fb0">Books</text>
    <rect x="554" y="284" width="84" height="40" rx="20" fill="#ff4678" fill-opacity="0.18"/>
    <text x="596" y="310" text-anchor="middle" fill="#ff8fb0">Apps</text>
  </g>
  <text x="82" y="372" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#a98bb8">Search · lookup · typed results · artwork · previews</text>
  <text x="82" y="406" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#80668e">async/await · Swift 6 · macOS and iOS · no API key</text>

  <!-- Mac window -->
  <g filter="url(#shadow)">
    <rect x="700" y="70" width="520" height="420" rx="16" fill="url(#window)"/>
  </g>
  <rect x="700" y="70" width="520" height="420" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="724" cy="94" r="6" fill="#ff5f57"/>
  <circle cx="744" cy="94" r="6" fill="#febc2e"/>
  <circle cx="764" cy="94" r="6" fill="#28c840"/>
  <!-- Search field -->
  <rect x="980" y="82" width="220" height="26" rx="8" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="996" cy="95" r="6" fill="none" stroke="#bbb3c2" stroke-width="2"/>
  <line x1="1000" y1="99" x2="1005" y2="104" stroke="#bbb3c2" stroke-width="2" stroke-linecap="round"/>
  <text x="1014" y="100" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#e9e2ee">daft punk</text>
  <!-- Sidebar -->
  <rect x="700" y="118" width="132" height="372" fill="#ffffff" fill-opacity="0.03"/>
  <g font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#d8cfdf">
    <rect x="710" y="136" width="112" height="24" rx="6" fill="#ff4678" fill-opacity="0.85"/>
    <text x="722" y="152" fill="#ffffff" font-weight="600">Songs</text>
    <text x="722" y="184">Albums</text>
    <text x="722" y="212">Artists</text>
    <text x="722" y="240">Podcasts</text>
    <text x="722" y="268">Movies</text>
    <text x="722" y="296">Books</text>
    <text x="722" y="324">Apps</text>
  </g>
  <!-- Artwork grid -->
  <g>
    <rect x="852" y="136" width="100" height="100" rx="6" fill="url(#tile1)"/>
    <rect x="968" y="136" width="100" height="100" rx="6" fill="url(#tile2)"/>
    <rect x="1084" y="136" width="100" height="100" rx="6" fill="url(#tile3)"/>
    <rect x="852" y="300" width="100" height="100" rx="6" fill="url(#tile4)"/>
    <rect x="968" y="300" width="100" height="100" rx="6" fill="url(#tile5)"/>
    <rect x="1084" y="300" width="100" height="100" rx="6" fill="url(#tile6)"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.85">
    <rect x="852" y="246" width="78" height="9" rx="4.5"/>
    <rect x="968" y="246" width="64" height="9" rx="4.5"/>
    <rect x="1084" y="246" width="84" height="9" rx="4.5"/>
    <rect x="852" y="410" width="70" height="9" rx="4.5"/>
    <rect x="968" y="410" width="86" height="9" rx="4.5"/>
    <rect x="1084" y="410" width="60" height="9" rx="4.5"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.35">
    <rect x="852" y="263" width="56" height="7" rx="3.5"/>
    <rect x="968" y="263" width="48" height="7" rx="3.5"/>
    <rect x="1084" y="263" width="60" height="7" rx="3.5"/>
    <rect x="852" y="427" width="50" height="7" rx="3.5"/>
    <rect x="968" y="427" width="62" height="7" rx="3.5"/>
    <rect x="1084" y="427" width="44" height="7" rx="3.5"/>
  </g>
  <!-- A music note on the middle tile and a play button on the first -->
  <g fill="#ffffff" fill-opacity="0.9">
    <rect x="1124" y="160" width="5" height="44" rx="2"/>
    <rect x="1148" y="154" width="5" height="44" rx="2"/>
    <polygon points="1124,160 1153,154 1153,164 1124,170"/>
    <ellipse cx="1120" cy="205" rx="10" ry="7"/>
    <ellipse cx="1144" cy="199" rx="10" ry="7"/>
  </g>
  <circle cx="930" cy="214" r="14" fill="#000000" fill-opacity="0.45"/>
  <polygon points="925,206 925,222 938,214" fill="#ffffff"/>
</svg>
